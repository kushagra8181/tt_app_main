name: Deploy Backend

on:
  push:
    branches:
      - feat/prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            cd ~/server/tt_app_fe/tt_app_main

            git checkout feat/prod
            git pull origin feat/prod
            
            npm install
            
            npm run build

            pm2 restart frontend